<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="reveal">
      <rect x="60" y="0" width="0" height="90">
        <animate attributeName="width" values="0;620;620;0" keyTimes="0;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <!-- typed quote -->
  <g clip-path="url(#reveal)">
    <text x="60" y="52" font-family="Consolas, 'Courier New', monospace" font-size="22" font-style="italic" fill="#38bdf8" textLength="620" lengthAdjust="spacing">"Securing the network, one packet at a time."</text>
  </g>
  <!-- blinking cursor -->
  <rect y="30" width="3" height="30" fill="#7dd3fc">
    <animate attributeName="x" values="60;680;680;60" keyTimes="0;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <!-- pulsing shield -->
  <g transform="translate(725 45)">
    <path d="M0 -20 L16 -13 V3 C16 13 8 19 0 23 C-8 19 -16 13 -16 3 V-13 Z" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2.5">
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M-6 2 L-1 7 L7 -5" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
