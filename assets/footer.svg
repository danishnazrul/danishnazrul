<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- transparent background: no rect -->
  <!-- twinkling stars -->
  <g fill="#38bdf8">
    <circle cx="110" cy="30" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="22" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="55" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="28" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="955" cy="80" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="85" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- quote -->
  <text x="500" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-style="italic" font-weight="600" fill="#38bdf8" opacity="0">
    "Securing the network, one packet at a time."
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>
  <!-- moving waves -->
  <path fill="#38bdf8" fill-opacity="0.25" d="M0 120 Q 125 90 250 120 T 500 120 T 750 120 T 1000 120 T 1250 120 T 1500 120 V160 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="#0ea5e9" fill-opacity="0.35" d="M0 138 Q 125 113 250 138 T 500 138 T 750 138 T 1000 138 T 1250 138 T 1500 138 V160 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="6s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
