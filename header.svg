<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="40" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="80" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="70" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="35" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="110" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="120" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- text -->
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" opacity="0">
    Danish Nazrul
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#7dd3fc" opacity="0">
    Computer Science • Network &amp; Security
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.8s" fill="freeze"/>
  </text>
  <!-- moving waves -->
  <path fill="#38bdf8" fill-opacity="0.25" d="M0 180 Q 125 150 250 180 T 500 180 T 750 180 T 1000 180 T 1250 180 T 1500 180 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="#0ea5e9" fill-opacity="0.35" d="M0 195 Q 125 170 250 195 T 500 195 T 750 195 T 1000 195 T 1250 195 T 1500 195 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="6s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
